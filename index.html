<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工程驗收分區記錄系統</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        @media print {
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            body { background: white; color: black; }
            .page-break { page-break-after: always; }
        }
        .print-only { display: none; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen font-sans">

    <!-- 頂部導覽列 -->
    <header class="bg-slate-900 text-white shadow-md no-print sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <i class="bi bi-building-check text-2xl text-emerald-400"></i>
                <h1 class="text-xl font-bold tracking-wide">工程驗收分區記錄系統</h1>
            </div>
            <div class="flex items-center space-x-3">
                <!-- 戶別切換下拉選單 -->
                <div class="relative">
                    <select id="unitSelect" onchange="switchUnit(this.value)" class="bg-slate-800 text-white border border-slate-700 text-sm rounded-lg focus:ring-emerald-500 focus:border-emerald-500 block p-2 pr-8 font-medium">
                        <!-- JS 動態渲染戶別 -->
                    </select>
                </div>
                <button onclick="openUnitModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm px-3 py-2 rounded-lg border border-slate-700 flex items-center gap-1 transition">
                    <i class="bi bi-gear"></i> 管理戶別
                </button>
                <button onclick="generateReport()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-sm px-3 py-2 rounded-lg font-medium flex items-center gap-1 transition shadow-sm">
                    <i class="bi bi-printer"></i> 產生報表
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6 space-y-6">

        <!-- 儀表板 Overview -->
        <section class="no-print">
            <div class="flex justify-between items-center mb-4">
                <div>
                    <span class="text-xs font-bold uppercase tracking-wider text-slate-400">當前戶別概況</span>
                    <h2 class="text-xl font-black text-slate-800" id="currentUnitTitle">--</h2>
                </div>
                <div class="bg-rose-50 border border-rose-100 rounded-xl px-4 py-2 text-right">
                    <span class="text-xs text-rose-500 font-medium">總缺失數</span>
                    <div class="text-2xl font-black text-rose-600" id="totalIssuesCount">0</div>
                </div>
            </div>

            <!-- 區域快速跳轉卡片區 -->
            <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-2.5" id="zoneOverviewCards">
                <!-- JS 動態渲染區域統計卡片 -->
            </div>
        </section>

        <!-- 區域分頁籤 & 操作區 -->
        <section class="no-print space-y-4">
            <!-- 區域切換 Tab -->
            <div class="flex gap-2 overflow-x-auto pb-2 scrollbar-none" id="zoneTabs">
                <!-- JS 動態渲染頁籤 -->
            </div>

            <!-- 當前區域主要內容面板 -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-5 space-y-6">
                <!-- 區域標題與按鈕 -->
                <div class="flex justify-between items-center border-b border-slate-100 pb-4">
                    <div class="flex items-center gap-2">
                        <span class="w-3 h-3 rounded-full bg-emerald-500"></span>
                        <h3 class="text-lg font-bold text-slate-800" id="currentZoneName">--</h3>
                        <span id="zoneIssueBadge" class="bg-rose-100 text-rose-700 text-xs px-2.5 py-0.5 rounded-full font-semibold">0 缺失</span>
                    </div>
                    <button onclick="openAddModal()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-medium text-sm px-4 py-2 rounded-xl flex items-center gap-2 transition shadow-sm">
                        <i class="bi bi-plus-lg"></i> 新增缺失
                    </button>
                </div>

                <!-- 缺失項目清單 -->
                <div id="issueList" class="space-y-3">
                    <!-- JS 動態渲染缺失卡片 -->
                </div>
            </div>
        </section>

        <!-- 列印報表專用區塊 (Print Only) -->
        <section id="printReportSection" class="print-only space-y-6 bg-white p-8">
            <div class="border-b-2 border-slate-900 pb-4 flex justify-between items-end">
                <div>
                    <h1 class="text-2xl font-bold text-slate-900">工程驗收缺失紀錄表</h1>
                    <p class="text-sm text-slate-600">戶別：<span id="printUnitName" class="font-bold text-slate-900"></span></p>
                </div>
                <div class="text-right text-xs text-slate-500">
                    <p>列印日期：<span id="printDate"></span></p>
                </div>
            </div>
            
            <div id="printContent" class="space-y-6">
                <!-- JS 動態渲染列印內容 -->
            </div>
        </section>

    </main>

    <!-- 新增 / 編輯缺失 Modal -->
    <div id="issueModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl shadow-xl max-w-lg w-full max-h-[90vh] flex flex-col overflow-hidden">
            <div class="p-4 border-b border-slate-100 flex justify-between items-center">
                <h3 class="text-lg font-bold text-slate-800" id="modalTitle">新增缺失項目</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600">
                    <i class="bi bi-x-lg text-lg"></i>
                </button>
            </div>
            
            <div class="p-5 overflow-y-auto space-y-4">
                <form id="issueForm" onsubmit="handleSaveIssue(event)" class="space-y-4">
                    <input type="hidden" id="issueId">
                    
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">常見缺失快速填寫</label>
                        <select onchange="applyPreset(this.value)" class="w-full bg-slate-50 border border-slate-200 text-sm rounded-xl p-2.5 text-slate-700">
                            <option value="">-- 選擇常用模板 --</option>
                            <option value="油漆刮傷 / 污損">油漆刮傷 / 污損</option>
                            <option value="牆面裂縫 / 空鼓">牆面裂縫 / 空鼓</option>
                            <option value="地磚空心 / 破損">地磚空心 / 破損</option>
                            <option value="門窗開合不順 / 異音">門窗開合不順 / 異音</option>
                            <option value="矽利康填縫不實">矽利康填縫不實</option>
                            <option value="排水不順 / 積水">排水不順 / 積水</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">缺失標題 <span class="text-rose-500">*</span></label>
                        <input type="text" id="issueTitle" required class="w-full border border-slate-200 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">詳細說明</label>
                        <textarea id="issueDesc" rows="3" class="w-full border border-slate-200 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none" placeholder="輸入具體位置或缺失細節..."></textarea>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">現場照片</label>
                        <input type="file" id="issuePhoto" accept="image/*" class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100">
                        <div id="photoPreviewContainer" class="mt-2 hidden relative rounded-xl overflow-hidden border border-slate-200">
                            <img id="photoPreview" src="" class="w-full h-48 object-cover">
                            <button type="button" onclick="removePhoto()" class="absolute top-2 right-2 bg-slate-900/70 text-white rounded-full p-1 w-7 h-7 flex items-center justify-center hover:bg-slate-900">
                                <i class="bi bi-x"></i>
                            </button>
                        </div>
                    </div>

                    <div class="flex gap-3 pt-2">
                        <button type="button" onclick="closeModal()" class="w-1/2 py-2.5 border border-slate-200 rounded-xl text-slate-600 text-sm font-medium hover:bg-slate-50">取消</button>
                        <button type="submit" class="w-1/2 py-2.5 bg-emerald-600 text-white rounded-xl text-sm font-medium hover:bg-emerald-500 shadow-sm">儲存缺失</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- 戶別管理 Modal -->
    <div id="unitModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-5 space-y-4">
            <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                <h3 class="text-lg font-bold text-slate-800">戶別管理</h3>
                <button onclick="closeUnitModal()" class="text-slate-400 hover:text-slate-600">
                    <i class="bi bi-x-lg"></i>
                </button>
            </div>

            <div class="flex gap-2">
                <input type="text" id="newUnitName" placeholder="輸入新戶別名稱 (例: A棟12F)" class="flex-1 border border-slate-200 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                <button onclick="addUnit()" class="bg-slate-900 text-white px-4 py-2.5 rounded-xl text-sm font-medium hover:bg-slate-800 transition">新增</button>
            </div>

            <div class="space-y-2 max-h-60 overflow-y-auto" id="unitManageList">
                <!-- JS 動態渲染戶別列表 -->
            </div>
        </div>
    </div>

    <!-- JavaScript 邏輯處理 -->
    <script>
        // 常數設定與基礎資料結構
        const ZONES = [
            { id: 'living', name: '客廳' },
            { id: 'master_bedroom', name: '主臥室' },
            { id: 'bedroom', name: '次臥室' },
            { id: 'kitchen', name: '廚房' },
            { id: 'bathroom', name: '主衛浴' },
            { id: 'guest_bathroom', name: '客衛浴' },
            { id: 'balcony', name: '陽台' },
            { id: 'entrance', name: '玄關' }
        ];

        let units = JSON.parse(localStorage.getItem('inspection_units')) || ['A棟10F', 'B棟5F'];
        let currentUnit = units[0];
        let currentZoneId = ZONES[0].id;
        let appData = JSON.parse(localStorage.getItem('inspection_data')) || {};
        let zonePlans = JSON.parse(localStorage.getItem('inspection_plans')) || {};
        let currentBase64Image = '';

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            initDataStructure();
            renderUnitOptions();
            renderZoneTabs();
            switchZone(currentZoneId);
            updateDashboard();
            setupPhotoUploadHandler();
        });

        // 資料初始化防呆
        function initDataStructure() {
            units.forEach(unit => {
                if (!appData[unit]) appData[unit] = {};
                ZONES.forEach(zone => {
                    if (!appData[unit][zone.id]) appData[unit][zone.id] = [];
                });
            });
            saveToStorage();
        }

        function saveToStorage() {
            localStorage.setItem('inspection_data', JSON.stringify(appData));
            localStorage.setItem('inspection_units', JSON.stringify(units));
            localStorage.setItem('inspection_plans', JSON.stringify(zonePlans));
        }

        // 渲染戶別選項
        function renderUnitOptions() {
            const select = document.getElementById('unitSelect');
            select.innerHTML = units.map(u => `<option value="${u}" ${u === currentUnit ? 'selected' : ''}>${u}</option>`).join('');
            document.getElementById('currentUnitTitle').innerText = currentUnit;
        }

        function switchUnit(unitName) {
            currentUnit = unitName;
            document.getElementById('currentUnitTitle').innerText = currentUnit;
            switchZone(currentZoneId);
            updateDashboard();
        }

        // 渲染區域 Tab
        function renderZoneTabs() {
            const tabsContainer = document.getElementById('zoneTabs');
            tabsContainer.innerHTML = ZONES.map(z => `
                <button onclick="switchZone('${z.id}')" id="tab-${z.id}" 
                    class="px-4 py-2 rounded-xl text-sm font-medium whitespace-nowrap transition border ${z.id === currentZoneId ? 'bg-slate-900 text-white border-slate-900 shadow-sm' : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50'}">
                    ${z.name}
                </button>
            `).join('');
        }

        function switchZone(zoneId) {
            currentZoneId = zoneId;
            renderZoneTabs();
            
            const currentZone = ZONES.find(z => z.id === zoneId);
            document.getElementById('currentZoneName').innerText = currentZone.name;
            
            const issues = appData[currentUnit][currentZoneId] || [];
            document.getElementById('zoneIssueBadge').innerText = `${issues.length} 缺失`;

            renderIssueList(issues);
        }

        // 渲染缺失卡片清單
        function renderIssueList(issues) {
            const container = document.getElementById('issueList');
            if (issues.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-10 text-slate-400">
                        <i class="bi bi-check-circle text-3xl block mb-2 text-emerald-400"></i>
                        <p class="text-sm">該區域目前無紀錄缺失</p>
                    </div>`;
                return;
            }

            container.innerHTML = issues.map((issue, index) => `
                <div class="bg-slate-50 border border-slate-200/80 rounded-xl p-4 flex flex-col md:flex-row justify-between items-start gap-4">
                    <div class="space-y-1.5 flex-1">
                        <div class="flex items-center gap-2">
                            <span class="bg-slate-200 text-slate-700 text-xs px-2 py-0.5 rounded font-mono font-bold">#${index + 1}</span>
                            <h4 class="font-bold text-slate-800">${issue.title}</h4>
                        </div>
                        <p class="text-sm text-slate-600 leading-relaxed">${issue.desc || '無詳細說明'}</p>
                        ${issue.photo ? `<img src="${issue.photo}" class="mt-2 w-32 h-24 object-cover rounded-lg border border-slate-200">` : ''}
                    </div>
                    <div class="flex items-center gap-2 self-end md:self-start">
                        <button onclick="editIssue('${issue.id}')" class="p-2 text-slate-500 hover:text-emerald-600 hover:bg-emerald-50 rounded-lg transition">
                            <i class="bi bi-pencil"></i>
                        </button>
                        <button onclick="deleteIssue('${issue.id}')" class="p-2 text-slate-500 hover:text-rose-600 hover:bg-rose-50 rounded-lg transition">
                            <i class="bi bi-trash"></i>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // 更新儀表板統計
        function updateDashboard() {
            const overviewContainer = document.getElementById('zoneOverviewCards');
            let total = 0;

            overviewContainer.innerHTML = ZONES.map(z => {
                const count = (appData[currentUnit][z.id] || []).length;
                total += count;
                return `
                    <div onclick="switchZone('${z.id}')" class="cursor-pointer bg-white border border-slate-200/80 hover:border-emerald-500 p-3 rounded-xl transition shadow-sm">
                        <div class="text-xs font-semibold text-slate-500">${z.name}</div>
                        <div class="text-lg font-black ${count > 0 ? 'text-rose-600' : 'text-slate-400'} mt-1">${count} <span class="text-xs font-normal text-slate-400">處</span></div>
                    </div>
                `;
            }).join('');

            document.getElementById('totalIssuesCount').innerText = total;
        }

        // 照片上傳處理 (帶有 Canvas 圖片壓縮)
        function setupPhotoUploadHandler() {
            document.getElementById('issuePhoto').addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(evt) {
                        const img = new Image();
                        img.src = evt.target.result;
                        img.onload = function() {
                            // Canvas 圖片壓縮限制長寬在 800px 以內
                            const canvas = document.createElement('canvas');
                            const MAX_WIDTH = 800;
                            let width = img.width;
                            let height = img.height;

                            if (width > MAX_WIDTH) {
                                height *= MAX_WIDTH / width;
                                width = MAX_WIDTH;
                            }

                            canvas.width = width;
                            canvas.height = height;

                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, width, height);

                            // 轉換為 JPEG 格式，壓縮品質 0.65
                            currentBase64Image = canvas.toDataURL('image/jpeg', 0.65);
                            document.getElementById('photoPreview').src = currentBase64Image;
                            document.getElementById('photoPreviewContainer').classList.remove('hidden');
                        };
                    };
                    reader.readAsDataURL(file);
                }
            });
        }

        function removePhoto() {
            currentBase64Image = '';
            document.getElementById('issuePhoto').value = '';
            document.getElementById('photoPreviewContainer').classList.add('hidden');
        }

        // Modal 操作邏輯
        function openAddModal() {
            document.getElementById('modalTitle').innerText = '新增缺失項目';
            document.getElementById('issueForm').reset();
            document.getElementById('issueId').value = '';
            currentBase64Image = '';
            document.getElementById('photoPreviewContainer').classList.add('hidden');
            document.getElementById('issueModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('issueModal').classList.add('hidden');
            currentBase64Image = ''; // 關閉時清空圖片快取
            document.getElementById('photoPreviewContainer').classList.add('hidden');
        }

        function applyPreset(val) {
            if (val) {
                document.getElementById('issueTitle').value = val;
            }
        }

        // 儲存缺失資料
        function handleSaveIssue(e) {
            e.preventDefault();
            const id = document.getElementById('issueId').value || 'issue_' + Date.now();
            const title = document.getElementById('issueTitle').value.trim();
            const desc = document.getElementById('issueDesc').value.trim();

            const issues = appData[currentUnit][currentZoneId];
            const existingIndex = issues.findIndex(i => i.id === id);

            const newIssue = {
                id,
                title,
                desc,
                photo: currentBase64Image || (existingIndex > -1 ? issues[existingIndex].photo : '')
            };

            if (existingIndex > -1) {
                issues[existingIndex] = newIssue;
            } else {
                issues.push(newIssue);
            }

            saveToStorage();
            closeModal();
            switchZone(currentZoneId);
            updateDashboard();
        }

        function editIssue(id) {
            const issue = appData[currentUnit][currentZoneId].find(i => i.id === id);
            if (!issue) return;

            document.getElementById('modalTitle').innerText = '編輯缺失項目';
            document.getElementById('issueId').value = issue.id;
            document.getElementById('issueTitle').value = issue.title;
            document.getElementById('issueDesc').value = issue.desc;

            if (issue.photo) {
                currentBase64Image = issue.photo;
                document.getElementById('photoPreview').src = issue.photo;
                document.getElementById('photoPreviewContainer').classList.remove('hidden');
            } else {
                currentBase64Image = '';
                document.getElementById('photoPreviewContainer').classList.add('hidden');
            }

            document.getElementById('issueModal').classList.remove('hidden');
        }

        function deleteIssue(id) {
            if (!confirm('確定要刪除此項缺失紀錄嗎？')) return;
            appData[currentUnit][currentZoneId] = appData[currentUnit][currentZoneId].filter(i => i.id !== id);
            saveToStorage();
            switchZone(currentZoneId);
            updateDashboard();
        }

        // 戶別管理邏輯
        function openUnitModal() {
            renderUnitManageList();
            document.getElementById('unitModal').classList.remove('hidden');
        }

        function closeUnitModal() {
            document.getElementById('unitModal').classList.add('hidden');
        }

        function renderUnitManageList() {
            const list = document.getElementById('unitManageList');
            list.innerHTML = units.map(u => `
                <div class="flex justify-between items-center bg-slate-50 p-2.5 rounded-xl border border-slate-100">
                    <span class="text-sm font-medium text-slate-700">${u}</span>
                    ${units.length > 1 ? `
                        <button onclick="deleteUnit('${u}')" class="text-rose-500 hover:text-rose-700 text-sm px-2 py-1">
                            <i class="bi bi-trash"></i>
                        </button>
                    ` : ''}
                </div>
            `).join('');
        }

        function addUnit() {
            const input = document.getElementById('newUnitName');
            const name = input.value.trim();
            if (!name) return;
            if (units.includes(name)) {
                alert('戶別已存在');
                return;
            }

            units.push(name);
            initDataStructure();
            renderUnitOptions();
            renderUnitManageList();
            input.value = '';
        }

        function deleteUnit(unitName) {
            if (units.length <= 1) {
                alert('至少需保留一個戶別');
                return;
            }
            if (!confirm(`確定要刪除戶別 ${unitName} 及其所有缺失資料嗎？`)) return;

            units = units.filter(u => u !== unitName);
            delete appData[unitName];
            delete zonePlans[unitName]; // 同步刪除戶別對應的平面圖設定

            saveToStorage();

            currentUnit = units[0];
            renderUnitOptions();
            renderUnitManageList();
            switchZone(currentZoneId);
            updateDashboard();
        }

        // 產生報表與列印處理
        function generateReport() {
            document.getElementById('printUnitName').innerText = currentUnit;
            document.getElementById('printDate').innerText = new Date().toLocaleDateString('zh-TW');

            const reportContainer = document.getElementById('printContent');
            let hasIssues = false;

            let html = ZONES.map(z => {
                const issues = appData[currentUnit][z.id] || [];
                if (issues.length === 0) return '';
                hasIssues = true;

                return `
                    <div class="space-y-3">
                        <h2 class="text-lg font-bold text-slate-800 border-b pb-1 border-slate-300">${z.name} (${issues.length} 處缺失)</h2>
                        <div class="grid grid-cols-1 gap-4">
                            ${issues.map((i, idx) => `
                                <div class="border border-slate-200 p-3 rounded-lg flex justify-between gap-4">
                                    <div class="space-y-1">
                                        <div class="font-bold text-slate-900 text-sm">#${idx + 1} ${i.title}</div>
                                        <div class="text-xs text-slate-600">${i.desc || '無詳細描述'}</div>
                                    </div>
                                    ${i.photo ? `<img src="${i.photo}" class="w-24 h-20 object-cover rounded border border-slate-300">` : ''}
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }).join('');

            if (!hasIssues) {
                html = `<div class="text-center py-12 text-slate-500 font-medium">該戶別完全無缺失紀錄</div>`;
            }

            reportContainer.innerHTML = html;
            window.print();
        }
    </script>
</body>
</html>
